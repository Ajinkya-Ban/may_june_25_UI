<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      .container {
        width: 80%;
        min-height: 100px;
        border: 1px solid #000;
        margin: auto;
      }
      .header-menu {
        width: 100%;
        height: 60px;
        background-color: black;
        display: flex;
        align-items: center;
        position: sticky;
        top: 0;
      }
      .header-menu .header {
        flex-basis: 50%;
      }
      .header h1 {
        color: white;
      }
      .header-menu .menu {
        flex-basis: 50%;
        display: flex;
        justify-content: flex-end;
      }
      .menu ul {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .menu ul li a {
        color: white;
        font-size: 1.2em;
        text-decoration: none;
      }
      #home {
        width: 100%;
        height: 700px;
        background-color: yellow;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #home h1 {
        /* margin-top: 10px; */
      }
      #about {
        width: 100%;
        height: 700px;
        background-color: orange;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #about h1 {
        /* margin-top: 20px; */
      }
      #service {
        width: 100%;
        height: 700px;
        background-color: lightskyblue;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #Product {
        width: 100%;
        height: 700px;
        background-color: lightslategray;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-menu">
        <div class="header">
          <h1>ByteCode</h1>
        </div>
        <div class="menu">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#service">Services</a></li>
            <li><a href="#Product">Products</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </div>
      </div>

      <div id="home">
        <h1>Home Page</h1>
      </div>

      <div id="about">
        <h1>About Page</h1>
      </div>

      <div id="service">
        <h1>Service Page</h1>
      </div>

      <div id="Product">
        <h1>Product Page</h1>
      </div>
    </div>
  </body>
</html>
