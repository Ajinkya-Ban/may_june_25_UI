<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        width: 60%;
        min-height: 100px;
        margin: auto;
        border: 1px solid #000;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 50px 200px 180px 200px 50px;
        gap: 5px;
        grid-template-areas:
          "header header header header"
          "bar slider slider slider"
          "bar b1 b2 b3"
          "cont cont cont cont"
          "footer footer footer footer";
      }
      .item {
        color: white;
        padding: 5px;
      }
      .header {
        background-color: black;
        grid-area: header;
      }
      .header h1 {
        font-size: 2.1em;
      }
      .bar {
        background-color: gray;
        grid-area: bar;
      }
      .slider {
        background-color: lightgoldenrodyellow;
        grid-area: slider;
      }
      .b1 {
        background-color: purple;
        grid-area: b1;
      }
      .b2 {
        background-color: purple;
        grid-area: b2;
      }
      .b3 {
        background-color: purple;
        grid-area: b3;
      }
      .cont {
        background-color: lightskyblue;
        grid-area: cont;
      }
      .footer {
        background-color: black;
        grid-area: footer;
      }

      /* media query */
      @media only screen and (max-width: 768px) {
        .container {
          width: 100%;
          grid-template-columns: 1fr;
          grid-template-rows: 50px 200px 200px 150px 150px 150px 200px 50px;
          grid-template-areas:
            "header"
            "slider"
            "bar"
            "b1"
            "b2"
            "b3"
            "cont"
            "footer";
        }
        .header h1 {
          font-size: 5vw;
        }
      }

      @media only screen and (max-width: 500px) {
        .header h1 {
          font-size: 7vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item header">
        <h1>ByteCode</h1>
      </div>
      <div class="item bar">Sidebar</div>
      <div class="item slider">Slider</div>
      <div class="item b1">Box1</div>
      <div class="item b2">Box2</div>
      <div class="item b3">Box3</div>
      <div class="item cont">Content</div>
      <div class="item footer">Footer</div>
    </div>
  </body>
</html>
