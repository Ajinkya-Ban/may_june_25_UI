<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        width: 80%;
        height: 100vh;
        border: 1px solid lightgray;
        /* background-image: linear-gradient(#485563, #29323c); */
        background-image: url(./imgs/shape2.jpg);
        background-size: 100% 100%;
        margin: auto;
        position: relative;
      }
      .info h1 {
        position: absolute;
        font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande",
          "Lucida Sans", Arial, sans-serif;
        font-size: 2.7em;
        text-align: center;
        color: white;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .d {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="info">
        <h1><span class="d">D</span>o Study hard, You Will Get Absolute</h1>
      </div>
    </div>
  </body>
</html>
