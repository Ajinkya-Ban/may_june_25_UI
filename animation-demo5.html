<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        width: 80%;
        min-height: 100px;
        /* border: 1px solid #000; */
        margin: auto;
      }
      .box {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box .text {
        width: 50%;
      }
      .text h2 {
        text-align: center;
        font-size: 50px;
        font-weight: bold;
      }
      .text p {
        text-align: center;
        font-size: 16px;
        margin-top: 10px;
      }
      .box .photo {
        width: 50%;
        animation-name: moveImg;
        animation-duration: 10s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }

      .photo img {
        width: 100%;
      }
      @keyframes moveImg {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-100px);
        }
        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="text">
          <h2>Welcome</h2>
          <p>
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eaque
            beatae ex inventore, qui impedit numquam architecto perferendis
            tempora cumque doloribus?
          </p>
        </div>

        <div class="photo">
          <img src="./imgs/login.jpg" />
        </div>
      </div>
    </div>
  </body>
</html>
